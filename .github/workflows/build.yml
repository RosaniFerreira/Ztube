name: Gerar ZTube.exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compilar
        run: go build -mod=vendor -trimpath -ldflags "-H windowsgui -s -w" -o ZTube.exe .

      - name: Guardar o executável
        uses: actions/upload-artifact@v4
        with:
          name: ZTube
          path: ZTube.exe

      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZTube.exe
